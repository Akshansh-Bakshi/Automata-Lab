[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automatalab-backend"
version = "0.1.0"
description = "FastAPI backend for AutomataLab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<6.101",
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.2",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040"] # Keep type aliases parseable for the documented Python 3.10 fallback checks.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["automatalab"]

[tool.setuptools.packages.find]
include = ["automatalab*"]

[tool.setuptools.package-data]
"automatalab.examples" = ["*.json"]

